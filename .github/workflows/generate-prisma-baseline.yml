name: Generate Prisma baseline (temporary)

on:
  push:
    branches:
      - build/generate-prisma-baseline
  pull_request:
    branches:
      - feature/agent-runtime-planning

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Prisma CLI
        run: npm install --no-audit --no-fund
      - name: Generate initial PostgreSQL schema migration from the pre-runtime schema
        run: |
          mkdir -p prisma/migrations/20261001000000_initial_schema
          npx prisma validate
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > prisma/migrations/20261001000000_initial_schema/migration.sql
          test -s prisma/migrations/20261001000000_initial_schema/migration.sql
      - name: Commit generated baseline to this temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations/20261001000000_initial_schema/migration.sql
          git commit -m "build(db): generate initial PostgreSQL baseline migration"
          git push origin HEAD:${{ github.ref_name }}
