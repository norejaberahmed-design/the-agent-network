services:
  postgres:
    image: postgres:16-alpine
    container_name: tan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: the_agent_network
      POSTGRES_USER: tan
      POSTGRES_PASSWORD: tan_local_only
    ports:
      - "5432:5432"
    volumes:
      - tan_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tan -d the_agent_network"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  tan_postgres_data:
